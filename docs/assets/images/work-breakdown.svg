<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="100%" role="img" aria-labelledby="work-breakdown-title work-breakdown-desc">
  <title id="work-breakdown-title">Work is broken down from an objective into tasks.</title>
  <desc id="work-breakdown-desc">A vertical tree connects Objective, Outcome, Feature or Design, Backlog item or Bug, and Task, with two faint siblings at each lower level showing one to many relationships and annotations explaining each level.</desc>
  <g fill="none" stroke="currentColor" stroke-width="1.3">
    <path d="M290 70 V100 M290 148 V178 M290 226 V256 M290 304 V334"/>
    <g opacity="0.3">
      <path d="M290 86 H60 V108 M126 86 V108"/>
      <path d="M290 164 H60 V186 M126 164 V186"/>
      <path d="M290 242 H60 V264 M126 242 V264"/>
      <path d="M290 320 H60 V342 M126 320 V342"/>
    </g>
  </g>
  <g fill="#e4e3e0" fill-opacity="0.25" stroke="currentColor" stroke-width="1.2">
    <g opacity="0.3">
      <rect x="34" y="108" width="52" height="32" rx="6"/>
      <rect x="100" y="108" width="52" height="32" rx="6"/>
      <rect x="34" y="186" width="52" height="32" rx="6"/>
      <rect x="100" y="186" width="52" height="32" rx="6"/>
      <rect x="34" y="264" width="52" height="32" rx="6"/>
      <rect x="100" y="264" width="52" height="32" rx="6"/>
      <rect x="34" y="342" width="52" height="32" rx="6"/>
      <rect x="100" y="342" width="52" height="32" rx="6"/>
    </g>
    <rect x="180" y="100" width="220" height="48" rx="9"/>
    <rect x="180" y="178" width="220" height="48" rx="9"/>
    <rect x="180" y="256" width="220" height="48" rx="9"/>
    <rect x="180" y="334" width="220" height="48" rx="9"/>
  </g>
  <rect x="180" y="22" width="220" height="48" rx="9" fill="#56002a"/>
  <text x="290" y="52" text-anchor="middle" font-family="inherit" font-size="17" fill="white">Objective</text>
  <g fill="currentColor" font-family="inherit" font-size="16" text-anchor="middle">
    <text x="290" y="130" font-family="inherit">Outcome</text>
    <text x="290" y="208" font-family="inherit">Feature or Design</text>
    <text x="290" y="286" font-family="inherit">Backlog item or Bug</text>
    <text x="290" y="364" font-family="inherit">Task</text>
  </g>
  <g fill="currentColor" font-family="inherit" font-size="13">
    <text x="428" y="51" font-family="inherit">a commitment of about three months</text>
    <text x="428" y="129" font-family="inherit">a measurable result</text>
    <text x="428" y="207" font-family="inherit">a unit of value a stakeholder understands</text>
    <text x="428" y="285" font-family="inherit">independently deployable</text>
    <text x="428" y="363" font-family="inherit">where effort is recorded</text>
  </g>
</svg>
